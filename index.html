<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Giao diện Sách Nhỏ Gọn</title>
    <style>
        :root {
            /* ĐÃ FIX CỨNG KÍCH THƯỚC ĐÃ THU NHỎ ĐÚNG TỶ LỆ TRÊN MÀN HÌNH WEB */
            --width-display: 77px;   /* Tương ứng kích thước thu nhỏ của 20.5cm */
            --height-display: 104px; /* Tương ứng kích thước thu nhỏ của 27.5cm */
        }

        body {
            font-family: Nunito, sans-serif;
            margin: 5px;
            background-color: #fff;
            color: #333;
        }

        /* Khung chứa bao gồm cả cây thước */
        .container {
            display: inline-grid;
            grid-template-columns: auto 1fr;
            grid-template-rows: auto 1fr;
            gap: 5px;
            padding: 5px;
        }

        /* Thước đo hàng ngang (Top) */
        .ruler-x {
            grid-column: 2;
            grid-row: 1;
            height: 16px;
            border-bottom: 2px solid #333;
            position: relative;
            width: var(--width-display);
        }
        .ruler-x::after {
            content: "20.5 cm";
            position: absolute;
            left: 50%;
            bottom: 2px;
            transform: translateX(-50%);
            font-size: 10px;
            font-weight: bold;
            white-space: nowrap;
        }

        /* Thước đo hàng dọc (Left) */
        .ruler-y {
            grid-column: 1;
            grid-row: 2;
            width: 32px;
            border-right: 2px solid #333;
            position: relative;
            height: var(--height-display);
        }
        .ruler-y::after {
            content: "27.5 cm";
            position: absolute;
            top: 50%;
            right: 4px;
            transform: translateY(-50%) rotate(-90deg);
            font-size: 10px;
            font-weight: bold;
            white-space: nowrap;
        }

        /* Khung hiển thị thông tin truyện */
        .book-card {
            grid-column: 2;
            grid-row: 2;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        /* Khung ảnh hỗ trợ hiệu ứng đổi hình khi Hover và ép đúng tỷ lệ nhỏ gọn */
        .image-container {
            position: relative;
            width: var(--width-display);
            height: var(--height-display);
            cursor: pointer;
            overflow: hidden;
            box-shadow: 0 3px 6px rgba(0,0,0,0.1);
            background-color: #f7f7f7;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: fill; /* Ép ảnh co giãn khít theo tỷ lệ */
            position: absolute;
            top: 0;
            left: 0;
            transition: opacity 0.25s ease;
        }

        /* Ảnh thứ 2 mặc định ẩn đi */
        .image-container .img-hover {
            opacity: 0;
        }

        /* Khi đưa chuột vào: ẩn ảnh gốc, hiện ảnh thứ 2 */
        .image-container:hover .img-main {
            opacity: 0;
        }
        .image-container:hover .img-hover {
            opacity: 1;
        }

        /* Phần text thông tin bên dưới ảnh */
        .book-title {
            font-size: 13px;
            font-weight: bold;
            margin: 6px 0 2px 0;
            max-width: var(--width-display);
            word-wrap: break-word;
            line-height: 1.2;
        }

        .book-author {
            font-size: 11px;
            color: #666;
            margin-bottom: 4px;
        }

        .btn-read-try {
            font-size: 11px;
            color: #0066cc;
            text-decoration: none;
        }
        .btn-read-try:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Thước ngang & dọc cố định thông số cm -->
    <div class="ruler-x"></div>
    <div class="ruler-y"></div>

    <!-- Khối thông tin truyện -->
    <div class="book-card">
        <!-- Nhấp vào ảnh dẫn tới link Google Form đặt hàng -->
        <a href="https://forms.gle" target="_blank">
            <div class="image-container">
                <!-- Ảnh gốc hiển thị ban đầu -->
                <img src="2.png" alt="Bìa trước" class="img-main">
                <!-- Ảnh thứ 2 hiển thị khi di chuột vào -->
                <img src="3.png" alt="Bìa sau hoặc quà tặng" class="img-hover">
            </div>
        </a>
        
        <!-- Thông tin văn bản -->
        <div class="book-title">The Blues of Now</div>
        <div class="book-author">Tác giả: Nguyễn Minh Quang</div>
        <a href="https://google.com" target="_blank" class="btn-read-try">Đọc thử tại đây</a>
    </div>
</div>

</body>
</html>
