<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Danh mục Sách Truyện</title>
    <script>
        // =========================================================================
        // DANH SÁCH SÁCH TRUYỆN CỦA BẠN (CHỈ CẦN THÊM HOẶC SỬA TẠI KHU VỰC NÀY)
        // =========================================================================
        const DANH_SACH_SACH = [
            {
                title: "The Blues of Now",
                author: "Nguyễn Minh Quang",
                imgMain: "2.png",
                imgHover: "3.png",
                widthCm: 20.5,
                heightCm: 27.5,
                linkForm: "https://forms.gle/VTx8ephBzrfhd3Pv5",
                linkRead: "https://sites.google.com/view/kychuongbooks/review"
            },
            {
                title: "The other's dream",
                author: "Lê Nguyễn Minh",
                imgMain: "4.png",
                imgHover: "2.png",
                widthCm: 21,
                heightCm: 27,
                linkForm: "https://forms.gle",
                linkRead: "https://google.com"
            }
            // Nếu muốn thêm quyển thứ 3, bạn chỉ cần copy cụm dấu {} ở trên, đặt sau dấu phẩy và đổi thông tin.
        ];

        // Hệ số thu nhỏ tỷ lệ 1/10 (Khoảng 3.75 pixel cho mỗi cm thực tế)
        const PIXEL_SCALE = 3.75; 
        // =========================================================================
    </script>
    
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            margin: 0;
            padding: 15px;
            background-color: transparent;
            color: #333;
        }

        /* Lưới hiển thị danh sách sách giống hệt ảnh mẫu */
        .books-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 25px;
            justify-content: start;
        }

        /* Khung chứa bao gồm thước đo bao quanh khối sách */
        .book-container {
            display: inline-grid;
            grid-template-columns: auto 1fr;
            grid-template-rows: auto 1fr;
            gap: 5px;
            margin-bottom: 15px;
            justify-items: center;
        }

        /* Thước đo hàng ngang */
        .ruler-x {
            grid-column: 2;
            grid-row: 1;
            height: 16px;
            border-bottom: 2px solid #555;
            position: relative;
        }
        .ruler-x::after {
            content: attr(data-label);
            position: absolute;
            left: 50%;
            bottom: 2px;
            transform: translateX(-50%);
            font-size: 10px;
            font-weight: bold;
            white-space: nowrap;
            color: #555;
        }

        /* Thước đo hàng dọc */
        .ruler-y {
            grid-column: 1;
            grid-row: 2;
            width: 32px;
            border-right: 2px solid #555;
            position: relative;
        }
        .ruler-y::after {
            content: attr(data-label);
            position: absolute;
            top: 50%;
            right: 4px;
            transform: translateY(-50%) rotate(-90deg);
            font-size: 10px;
            font-weight: bold;
            white-space: nowrap;
            color: #555;
        }

        /* Thẻ thông tin chi tiết của truyện */
        .book-card {
            grid-column: 2;
            grid-row: 2;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            width: 100%;
        }

        /* Khung ảnh hiệu ứng Hover */
        .image-container {
            position: relative;
            cursor: pointer;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            border-radius: 4px;
            background-color: #f7f7f7;
            width: 100%;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: fill;
            position: absolute;
            top: 0;
            left: 0;
            transition: opacity 0.25s ease;
        }

        .image-container .img-hover {
            opacity: 0;
        }

        .image-container:hover .img-main {
            opacity: 0;
        }
        .image-container:hover .img-hover {
            opacity: 1;
        }

        /* Tên truyện nằm dưới ảnh giống mẫu */
        .book-title {
            font-size: 14px;
            font-weight: 500;
            color: #222;
            margin: 10px 0 4px 0;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Tên tác giả */
        .book-author {
            font-size: 12px;
            color: #777;
            margin-bottom: 6px;
        }

        /* Nút link đọc thử */
        .btn-read-try {
            font-size: 12px;
            color: #0066cc;
            text-decoration: none;
            font-weight: bold;
        }
        .btn-read-try:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="books-grid" id="books-container"></div>

<script>
    // Vì index.html nằm chung thư mục với ảnh trên GitHub, ta dùng luôn đường dẫn tương đối, không cần ghép URL tuyệt đối
    const container = document.getElementById('books-container');

    DANH_SACH_SACH.forEach((book) => {
        // Tính kích thước khung ảnh theo tỷ lệ scale
        const displayWidth = Math.round(book.widthCm * PIXEL_SCALE) + 'px';
        const displayHeight = Math.round(book.heightCm * PIXEL_SCALE) + 'px';

        const bookHtml = `
            <div class="book-container">
                <div class="ruler-x" style="width: ${displayWidth};" data-label="${book.widthCm} cm"></div>
                <div class="ruler-y" style="height: ${displayHeight};" data-label="${book.heightCm} cm"></div>
                <div class="book-card">
                    <a href="${book.linkForm}" target="_blank" style="width: ${displayWidth};">
                        <div class="image-container" style="width: ${displayWidth}; height: ${displayHeight};">
                            <img src="${book.imgMain}" alt="${book.title}" class="img-main">
                            <img src="${book.imgHover}" alt="${book.title} Hover" class="img-hover">
                        </div>
                    </a>
                    <div class="book-title" style="max-width: ${displayWidth};">${book.title}</div>
                    <div class="book-author">Tác giả: ${book.author}</div>
                    <a href="${book.linkRead}" target="_blank" class="btn-read-try">Đọc thử tại đây</a>
                </div>
            </div>
        `;
        container.innerHTML += bookHtml;
    });
</script>

</body>
</html>
