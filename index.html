<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Giao diện Sách</title>
    <style>
        :root {
            /* CẤU HÌNH KÍCH THƯỚC KHỔ GIẤY THẬT (ĐƠN VỊ MM) ĐỂ THU NHỎ CHUẨN XÁC */
            --chieu-rong-that-mm: 205; /* 20.5cm đổi sang mm */
            --chieu-cao-that-mm: 275;  /* 27.5cm đổi sang mm */
            
            /* Tỉ lệ hiển thị màn hình (Hệ số 0.378 giúp quy đổi kích thước thật thu nhỏ 10 lần ra chuẩn pixel) */
            --ti-le-pixel: 0.378; 
            
            /* Tính toán kích thước khung hiển thị tự động */
            --width-display: calc(var(--chieu-rong-that-mm) * var(--ti-le-pixel) * 1px);
            --height-display: calc(var(--chieu-cao-that-mm) * var(--ti-le-pixel) * 1px);
        }

        body {
            font-family: Nunito, sans-serif;
            margin: 10px;
            background-color: #fff;
            color: #333;
        }

        /* Khung chứa bao gồm cả cây thước */
        .container {
            display: inline-grid;
            grid-template-columns: auto 1fr;
            grid-template-rows: auto 1fr;
            gap: 6px;
            padding: 5px;
        }

        /* Thước đo hàng ngang (Top) */
        .ruler-x {
            grid-column: 2;
            grid-row: 1;
            height: 18px;
            border-bottom: 2px solid #333;
            position: relative;
            width: var(--width-display);
        }
        .ruler-x::after {
            content: attr(data-label);
            position: absolute;
            left: 50%;
            bottom: 2px;
            transform: translateX(-50%);
            font-size: 11px;
            font-weight: bold;
        }

        /* Thước đo hàng dọc (Left) */
        .ruler-y {
            grid-column: 1;
            grid-row: 2;
            width: 35px;
            border-right: 2px solid #333;
            position: relative;
            height: var(--height-display);
        }
        .ruler-y::after {
            content: attr(data-label);
            position: absolute;
            top: 50%;
            right: 5px;
            transform: translateY(-50%) rotate(-90deg);
            font-size: 11px;
            font-weight: bold;
            white-space: nowrap;
        }

        /* Khung hiển thị thông tin truyện */
        .book-card {
            grid-column: 2;
            grid-row: 2;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        /* Khung ảnh hỗ trợ hiệu ứng đổi hình khi Hover và ép đúng tỷ lệ */
        .image-container {
            position: relative;
            width: var(--width-display);
            height: var(--height-display);
            cursor: pointer;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            background-color: #f7f7f7;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: fill; /* Ép ảnh co giãn khít theo tỷ lệ vàng của khổ giấy */
            position: absolute;
            top: 0;
            left: 0;
            transition: opacity 0.3s ease;
        }

        /* Ảnh thứ 2 mặc định ẩn đi */
        .image-container .img-hover {
            opacity: 0;
        }

        /* Khi đưa chuột vào: ẩn ảnh gốc, hiện ảnh thứ 2 */
        .image-container:hover .img-main {
            opacity: 0;
        }
        .image-container:hover .img-hover {
            opacity: 1;
        }

        /* Phần text thông tin bên dưới ảnh */
        .book-title {
            font-size: 16px;
            font-weight: bold;
            margin: 10px 0 3px 0;
            max-width: var(--width-display);
            word-wrap: break-word;
        }

        .book-author {
            font-size: 13px;
            color: #666;
            margin-bottom: 6px;
        }

        .btn-read-try {
            font-size: 13px;
            color: #0066cc;
            text-decoration: none;
        }
        .btn-read-try:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Thước ngang & dọc (Tự động điền số cm vào label từ Script) -->
    <div class="ruler-x" id="rx"></div>
    <div class="ruler-y" id="ry"></div>

    <!-- Khối thông tin truyện -->
    <div class="book-card">
        <!-- Nhấp vào ảnh dẫn tới link Google Form đặt hàng -->
        <a href="https://forms.gle/s8kRrWggnDmkEp157" target="_blank">
            <div class="image-container">
                <!-- Ảnh gốc hiển thị ban đầu -->
                <img src="2.png" alt="Bìa trước" class="img-main">
                <!-- Ảnh thứ 2 hiển thị khi di chuột vào -->
                <img src="3.png" alt="Bìa sau hoặc quà tặng" class="img-hover">
            </div>
        </a>
        
        <!-- Thông tin văn bản -->
        <div class="book-title">The Blues of Now</div>
        <div class="book-author">Tác giả: Nguyễn Minh Quang</div>
        <a href="https://sites.google.com/view/kychuongbooks/review" target="_blank" class="btn-read-try">Đọc thử tại đây</a>
    </div>
</div>

<script>
    // Tự động chuyển đổi hiển thị số cm thật lên thanh thước đo
    const root = document.documentElement;
    const wMm = parseFloat(getComputedStyle(root).getPropertyValue('--chieu-rong-that-mm'));
    const hMm = parseFloat(getComputedStyle(root).getPropertyValue('--chieu-cao-that-mm'));
    
    document.getElementById('rx').setAttribute('data-label', (wMm / 10) + ' cm');
    document.getElementById('ry').setAttribute('data-label', (hMm / 10) + ' cm');
</script>

</body>
</html>
