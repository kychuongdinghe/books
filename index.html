<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xem thêm sách</title>
<style>
  .book-card {
    display: block;
    width: 100%;
    max-width: 240px;
    text-decoration: none;
    color: #222;
  }

  .book-image {
    width: 100%;
    aspect-ratio: 2 / 3;
    overflow: hidden;
    border-radius: 4px;
    transition: box-shadow 0.35s ease;
  }

  .book-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;

    transition:
      transform 0.35s ease,
      filter 0.35s ease;
  }

  .book-card:hover .book-image {
    box-shadow: 0 8px 20px rgba(0,0,0,0.25);
  }

  .book-card:hover .book-image img {
    transform: scale(1.12);
    filter: contrast(1.1) saturate(1.25) brightness(0.95);
  }

  .book-title {
    margin-top: 10px;
    font-size: 15px;
    text-align: center;
    color: #222;
    font-family: Arial, sans-serif;
    transition: color 0.25s ease;
  }

  .book-card:hover .book-title {
    color: #7A2E2E;
    text-decoration: underline;
  }
</style>
</head>
<body>

<a href="https://forms.gle/CHxHK9aetnco9cxm9" class="book-card" target="_blank" rel="noopener noreferrer">
  <div class="book-image">
    <img src="https://raw.githubusercontent.com/kychuongdinghe/kychuong-image/2809af10c152352bb7f2f9251c785fb3535bce7e/3.png" alt="Tên sách">
  </div>
  <div class="book-title">
    Xem thêm
  </div>
</a>

</body>
</html>
