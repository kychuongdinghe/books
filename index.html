<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Danh mục Sách Phong Cách Hiện Đại</title>
    <script>
        // =========================================================================
        // CẤU HÌNH HỆ THỐNG TẠI ĐÂY (CHỈ CẦN THAY ĐỔI KHU VỰC NÀY)
        // =========================================================================
        const SHEET_ID          = '1UdZcyN1rjHxQChTS7hxM0EqrPyORxiXne7JHFPws4bg'; 
        const GITHUB_FOLDER_URL = 'https://raw.githubusercontent.com / kychuongdinghe / books / main / 2.png';
        
        // Hệ số thu nhỏ tỷ lệ 1/10 (Khoảng 3.75 pixel cho mỗi cm thực tế)
        const PIXEL_SCALE       = 3.75; 
        // =========================================================================
    </script>
    <style>
        body {
            font-family: Nunito, sans-serif;
            margin: 0;
            padding: 15px;
            background-color: transparent;
            color: #333;
        }

        /* Lưới hiển thị danh sách sách giống hệt ảnh mẫu */
        .books-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 25px;
            justify-content: start;
        }

        /* Khung chứa bao gồm thước đo bao quanh khối sách */
        .book-container {
            display: inline-grid;
            grid-template-columns: auto 1fr;
            grid-template-rows: auto 1fr;
            gap: 5px;
            margin-bottom: 15px;
            justify-items: center; /* Căn giữa khối sách theo thước ngang */
        }

        /* Thước đo hàng ngang */
        .ruler-x {
            grid-column: 2;
            grid-row: 1;
            height: 16px;
            border-bottom: 2px solid #555;
            position: relative;
        }
        .ruler-x::after {
            content: attr(data-label);
            position: absolute;
            left: 50%;
            bottom: 2px;
            transform: translateX(-50%);
            font-size: 10px;
            font-weight: bold;
            white-space: nowrap;
            color: #555;
        }

        /* Thước đo hàng dọc */
        .ruler-y {
            grid-column: 1;
            grid-row: 2;
            width: 32px;
            border-right: 2px solid #555;
            position: relative;
        }
        .ruler-y::after {
            content: attr(data-label);
            position: absolute;
            top: 50%;
            right: 4px;
            transform: translateY(-50%) rotate(-90deg);
            font-size: 10px;
            font-weight: bold;
            white-space: nowrap;
            color: #555;
        }

        /* Thẻ thông tin chi tiết của truyện */
        .book-card {
            grid-column: 2;
            grid-row: 2;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            width: 100%;
        }

        /* Khung ảnh hiệu ứng Hover */
        .image-container {
            position: relative;
            cursor: pointer;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08); /* Đổ bóng nhẹ chuẩn phong cách web bán sách */
            border-radius: 4px;
            background-color: #f7f7f7;
            width: 100%;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: fill;
            position: absolute;
            top: 0;
            left: 0;
            transition: opacity 0.25s ease;
        }

        .image-container .img-hover {
            opacity: 0;
        }

        .image-container:hover .img-main {
            opacity: 0;
        }
        .image-container:hover .img-hover {
            opacity: 1;
        }

        /* Tên truyện nằm dưới ảnh giống mẫu */
        .book-title {
            font-size: 14px;
            font-weight: 500;
            color: #222;
            margin: 10px 0 4px 0;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2; /* Tự động cắt chữ nếu tên truyện quá dài (tối đa 2 dòng) */
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Tên tác giả */
        .book-author {
            font-size: 12px;
            color: #777;
            margin-bottom: 6px;
        }

        /* Nút link đọc thử */
        .btn-read-try {
            font-size: 12px;
            color: #0066cc;
            text-decoration: none;
            font-weight: bold;
        }
        .btn-read-try:hover {
            text-decoration: underline;
        }
        
        .loading {
            font-size: 14px;
            color: #666;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="books-grid" id="books-container">
    <div class="loading">Đang tải danh mục sách truyện...</div>
</div>

<script>
    const url = `https://google.com{SHEET_ID}/gviz/tq?tqx=out:json`;

    fetch(url)
        .then(res => res.text())
        .then(data => {
            const match = data.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\);/);
            if (!match || !match[1]) throw new Error("Không thể bóc tách dữ liệu");
            
            const json = JSON.parse(match[1]);
            const rows = json.table.rows;
            
            const container = document.getElementById('books-container');
            container.innerHTML = ''; 

            rows.forEach((row) => {
                if (!row || !row.c) return;

                const getVal = (index) => {
                    return (row.c[index] && row.c[index].v !== null) ? row.c[index].v : '';
                };

                const title        = getVal(0).toString().trim(); 
                const author       = getVal(1).toString().trim(); 
                const imgMainName  = getVal(2).toString().trim(); 
                const imgHoverName = getVal(3).toString().trim(); 
                const widthCm      = parseFloat(getVal(4)) || 0;  
                const heightCm     = parseFloat(getVal(5)) || 0;  
                const linkForm     = getVal(6).toString().trim() || '#'; 
                const linkRead     = getVal(7).toString().trim() || '#'; 

                if (title.toLowerCase() === 'title' || !title) return;

                const imgMain  = GITHUB_FOLDER_URL + imgMainName;
                const imgHover = GITHUB_FOLDER_URL + imgHoverName;

                // Tính kích thước khung ảnh theo tỷ lệ scale đã khai báo ở trên đầu
                const displayWidth = Math.round(widthCm * PIXEL_SCALE) + 'px';
                const displayHeight = Math.round(heightCm * PIXEL_SCALE) + 'px';

                const bookHtml = `
                    <div class="book-container">
                        <div class="ruler-x" style="width: ${displayWidth};" data-label="${widthCm} cm"></div>
                        <div class="ruler-y" style="height: ${displayHeight};" data-label="${heightCm} cm"></div>
                        <div class="book-card">
                            <a href="${linkForm}" target="_blank" style="width: ${displayWidth};">
                                <div class="image-container" style="width: ${displayWidth}; height: ${displayHeight};">
                                    <img src="${imgMain}" alt="${title}" class="img-main">
                                    <img src="${imgHover}" alt="${title} Hover" class="img-hover">
                                </div>
                            </a>
                            <div class="book-title" style="max-width: ${displayWidth};">${title}</div>
                            <div class="book-author">Tác giả: ${author}</div>
                            <a href="${linkRead}" target="_blank" class="btn-read-try">Đọc thử tại đây</a>
                        </div>
                    </div>
                `;
                container.innerHTML += bookHtml;
            });
            
            if (container.innerHTML === '') {
                container.innerHTML = '<div class="loading">Không tìm thấy dữ liệu truyện trong bảng tính.</div>';
            }
        })
        .catch(err => {
            document.getElementById('books-container').innerHTML = '<div class="loading" style="color:red;">Không thể đồng bộ dữ liệu. Vui lòng kiểm tra lại cấu trúc bảng tính hoặc kết nối mạng!</div>';
            console.error(err);
        });
</script>

</body>
</html>
