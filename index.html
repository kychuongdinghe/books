<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Danh mục Sách Truyện kích thước lớn</title>
    <script>
        // =========================================================================
        // DANH SÁCH SÁCH TRUYỆN CỦA BẠN (CHỈ CẦN THÊM HOẶC SỬA TẠI KHU VỰC NÀY)
        // =========================================================================
        const DANH_SACH_SACH = [
            {
                title: "The Blues of Now - Bìa cứng",
                author: "Nguyễn Minh Quang",
                imgMain: "2.png",
                imgHover: "3.png",
                linkForm: "https://forms.gle",
                linkRead: "https://google.com"
            },
            {
                title: "The Blues of Now - Bìa mềm",
                author: "Nguyễn Minh Quang",
                imgMain: "2.png", // Bạn có thể thay đổi bằng file ảnh bìa cứng riêng nếu có
                imgHover: "3.png",
                linkForm: "https://forms.gle",
                linkRead: "https://google.com"
            },
            {
                title: "The other's dream - Bìa cứng",
                author: "Lê Nguyễn Minh",
                imgMain: "4.png",
                imgHover: "2.png",
                linkForm: "https://forms.gle",
                linkRead: "https://google.com"
            }
        ];

        // Cấu hình kích thước ô hiển thị ảnh: 600px rộng x 850px cao
        const BOOK_WIDTH  = "600px";
        const BOOK_HEIGHT = "850px";
        // =========================================================================
    </script>
    
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            margin: 0;
            padding: 20px;
            background-color: transparent;
            color: #333;
        }

        /* Lưới hiển thị danh sách sách tự động xuống dòng khi hết không gian ngang */
        .books-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 50px; /* Khoảng cách thông thoáng giữa các ô sách lớn */
            justify-content: flex-start;
        }

        /* Khối hiển thị tổng thể của một cuốn sách */
        .book-card {
            display: flex;
            flex-direction: column;
            align-items: center; 
            text-align: center;
        }

        /* Khung chứa ảnh cố định kích thước chuẩn 600x850 (Đã bỏ hoàn toàn nền và khung thước) */
        .image-container {
            position: relative;
            cursor: pointer;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Ảnh tự co giãn vừa khít theo tỷ lệ gốc bên trong không gian 600x850 */
        .image-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain; 
            position: absolute;
            transition: opacity 0.25s ease;
            box-shadow: 0 6px 16px rgba(0,0,0,0.12); /* Đổ bóng nhẹ nghệ thuật để nổi bật khối sách lớn */
        }

        .image-container .img-hover {
            opacity: 0;
        }

        /* Hiệu ứng Hover lật ảnh bìa sau mượt mà */
        .image-container:hover .img-main {
            opacity: 0;
        }
        .image-container:hover .img-hover {
            opacity: 1;
        }

        /* Định dạng phần chữ căn giữa tương xứng với kích thước ảnh lớn */
        .book-title {
            font-size: 20px; /* Tăng cỡ chữ để cân đối với ảnh 600px */
            font-weight: bold;
            color: #111;
            margin: 18px 0 6px 0;
            line-height: 1.4;
            width: 100%;
            word-wrap: break-word;
        }

        .book-author {
            font-size: 16px;
            color: #666;
            margin-bottom: 8px;
            width: 100%;
        }

        .btn-read-try {
            font-size: 16px;
            color: #0066cc;
            text-decoration: none;
            font-weight: bold;
            width: 100%;
            display: block;
            margin-top: 4px;
        }
        .btn-read-try:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="books-grid" id="books-container"></div>

<script>
    const container = document.getElementById('books-container');

    DANH_SACH_SACH.forEach((book) => {
        const bookHtml = `
            <div class="book-card" style="width: ${BOOK_WIDTH};">
                <!-- Nhấp vào ảnh dẫn thẳng tới trang đặt mua -->
                <a href="${book.linkForm}" target="_blank" style="display: block; width: 100%;">
                    <div class="image-container" style="width: ${BOOK_WIDTH}; height: ${BOOK_HEIGHT};">
                        <img src="${book.imgMain}" alt="${book.title}" class="img-main">
                        <img src="${book.imgHover}" alt="${book.title} Hover" class="img-hover">
                    </div>
                </a>
                
                <!-- Thông tin văn bản căn giữa đồng đều -->
                <div class="book-title">${book.title}</div>
                <div class="book-author">Tác giả: ${book.author}</div>
                <a href="${book.linkRead}" target="_blank" class="btn-read-try">Đọc thử tại đây</a>
            </div>
        `;
        container.innerHTML += bookHtml;
    });
</script>

</body>
</html>
