<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Danh mục Sách Truyện</title>
    <script>
        // =========================================================================
        // DANH SÁCH SÁCH TRUYỆN CỦA BẠN (CHỈ CẦN THÊM HOẶC SỬA TẠI KHU VỰC NÀY)
        // =========================================================================
        const DANH_SACH_SACH = [
            {
                title: "The Blues of Now",
                author: "Nguyễn Minh Quang",
                imgMain: "2.png",
                imgHover: "3.png",
                widthCm: 20.5,
                heightCm: 27.5,
                linkForm: "https://forms.gle",
                linkRead: "https://google.com"
            },
            {
                title: "The other's dream",
                author: "Lê Nguyễn Minh",
                imgMain: "4.png",
                imgHover: "2.png",
                widthCm: 21,
                heightCm: 27,
                linkForm: "https://forms.gle",
                linkRead: "https://google.com"
            }
        ];

        // Hệ số quy đổi kích thước ô xám 16x9 cm ra màn hình web
        const PIXEL_SCALE = 3.78; 
        const FRAME_WIDTH = Math.round(16 * 10 * PIXEL_SCALE) + "px";  // ~605px
        const FRAME_HEIGHT = Math.round(9 * 10 * PIXEL_SCALE) + "px";  // ~340px
        // =========================================================================
    </script>
    
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            margin: 0;
            padding: 15px;
            background-color: transparent;
            color: #333;
        }

        /* Lưới hiển thị danh sách sách tự động xuống dòng */
        .books-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 40px;
            justify-content: flex-start;
        }

        /* Khung chứa tổng thể bao gồm cả thước đo */
        .book-container {
            display: inline-grid;
            grid-template-columns: auto 1fr;
            grid-template-rows: auto 1fr;
            gap: 8px;
            margin-bottom: 25px;
        }

        /* Thước đo hàng ngang */
        .ruler-x {
            grid-column: 2;
            grid-row: 1;
            height: 18px;
            border-bottom: 2px solid #555;
            position: relative;
        }
        .ruler-x::after {
            content: attr(data-label);
            position: absolute;
            left: 50%;
            bottom: 3px;
            transform: translateX(-50%);
            font-size: 11px;
            font-weight: bold;
            white-space: nowrap;
            color: #444;
        }

        /* Thước đo hàng dọc */
        .ruler-y {
            grid-column: 1;
            grid-row: 2;
            width: 35px;
            border-right: 2px solid #555;
            position: relative;
        }
        .ruler-y::after {
            content: attr(data-label);
            position: absolute;
            top: 50%;
            right: 5px;
            transform: translateY(-50%) rotate(-90deg);
            font-size: 11px;
            font-weight: bold;
            white-space: nowrap;
            color: #444;
        }

        /* Khối hiển thị thông tin và ô xám tro */
        .book-card {
            grid-column: 2;
            grid-row: 2;
            display: flex;
            flex-direction: column;
            align-items: center; /* Căn giữa toàn bộ text bên dưới */
            text-align: center;
        }

        /* Ô hiển thị nền xám tro kích thước chuẩn 16 x 9 cm */
        .image-box-frame {
            position: relative;
            background-color: #f0f0f0; /* Màu xám tro */
            border-radius: 6px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.02), 0 4px 12px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            overflow: hidden;
        }

        /* Ảnh hiển thị theo tỷ lệ gốc bên trong ô xám */
        .image-box-frame img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain; /* Giữ nguyên tỷ lệ ảnh gốc, không bị hẹp */
            position: absolute;
            transition: opacity 0.25s ease;
            box-shadow: 0 4px 8px rgba(0,0,0,0.12); /* Tạo hiệu ứng đổ bóng cho riêng cuốn sách */
        }

        .image-box-frame .img-hover {
            opacity: 0;
        }

        /* Hiệu ứng Hover đổi ảnh bìa sau mượt mà */
        .image-box-frame:hover .img-main {
            opacity: 0;
        }
        .image-box-frame:hover .img-hover {
            opacity: 1;
        }

        /* Định dạng phần text đã dàn đều và tăng cỡ chữ */
        .book-title {
            font-size: 16px;
            font-weight: bold;
            color: #111;
            margin: 14px 0 5px 0;
            line-height: 1.3;
            width: 100%;
            word-wrap: break-word;
        }

        .book-author {
            font-size: 13px;
            color: #666;
            margin-bottom: 8px;
            width: 100%;
        }

        .btn-read-try {
            font-size: 14px;
            color: #0066cc;
            text-decoration: none;
            font-weight: bold;
            width: 100%;
            display: block;
            margin-top: 2px;
        }
        .btn-read-try:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="books-grid" id="books-container"></div>

<script>
    const container = document.getElementById('books-container');

    // Áp dụng kích thước khung xám cố định cho tất cả sách
    document.documentElement.style.setProperty('--frame-w', FRAME_WIDTH);
    document.documentElement.style.setProperty('--frame-h', FRAME_HEIGHT);

    DANH_SACH_SACH.forEach((book) => {
        const bookHtml = `
            <div class="book-container">
                <!-- Thước đo vẫn hiển thị số cm thực tế lấy từ data dữ liệu của bạn -->
                <div class="ruler-x" style="width: ${FRAME_WIDTH};" data-label="${book.widthCm} cm"></div>
                <div class="ruler-y" style="height: ${FRAME_HEIGHT};" data-label="${book.heightCm} cm"></div>
                
                <div class="book-card" style="width: ${FRAME_WIDTH};">
                    <!-- Ô hiển thị xám tro liên kết đến biểu mẫu đặt hàng -->
                    <a href="${book.linkForm}" target="_blank" style="display: block; width: 100%;">
                        <div class="image-box-frame" style="width: ${FRAME_WIDTH}; height: ${FRAME_HEIGHT};">
                            <img src="${book.imgMain}" alt="${book.title}" class="img-main">
                            <img src="${book.imgHover}" alt="${book.title} Hover" class="img-hover">
                        </div>
                    </a>
                    
                    <!-- Phần text thông tin đã được căn giữa toàn bộ -->
                    <div class="book-title">${book.title}</div>
                    <div class="book-author">Tác giả: ${book.author}</div>
                    <a href="${book.linkRead}" target="_blank" class="btn-read-try">Đọc thử tại đây</a>
                </div>
            </div>
        `;
        container.innerHTML += bookHtml;
    });
</script>

</body>
</html>
