<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Danh mục Sách Truyện Tối Giản</title>
    <script>
        // =========================================================================
        // DANH SÁCH SÁCH TRUYỆN CỦA BẠN (CHỈ CẦN THÊM HOẶC SỬA TẠI KHU VỰC NÀY)
        // =========================================================================
        const DANH_SACH_SACH = [
            {
                title: "The Blues of Now",
                author: "Nguyễn Minh Quang",
                imgMain: "2.png",
                imgHover: "3.png",
                linkForm: "https://forms.gle",
                linkRead: "https://google.com"
            },
            {
                title: "The Blues of Now - Bìa cứng",
                author: "Nguyễn Minh Quang",
                imgMain: "2.png",
                imgHover: "3.png",
                linkForm: "https://forms.gle",
                linkRead: "https://google.com"
            },
            {
                title: "The other's dream",
                author: "Lê Nguyễn Minh",
                imgMain: "4.png",
                imgHover: "2.png",
                linkForm: "https://forms.gle",
                linkRead: "https://google.com"
            }
        ];

        // Đã giảm kích thước xuống gọn gàng (vẫn giữ đúng tỷ lệ đứng của bìa truyện)
        const BOOK_WIDTH  = "300px";
        const BOOK_HEIGHT = "425px";
        // =========================================================================
    </script>
    
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            margin: 0;
            padding: 10px;
            background-color: transparent;
            color: #333;
        }

        /* Lưới hiển thị danh sách sách tự động xuống dòng */
        .books-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 30px; /* Thu hẹp khoảng cách giữa các cột sách */
            justify-content: flex-start;
        }

        /* Khối hiển thị tổng thể của một cuốn sách */
        .book-card {
            display: flex;
            flex-direction: column;
            align-items: center; 
            text-align: center;
        }

        /* Khung chứa ảnh (Đã xóa bỏ hoàn toàn tất cả hiệu ứng đổ bóng shadow) */
        .image-container {
            position: relative;
            cursor: pointer;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            box-shadow: none !important; /* Chặn hoàn toàn mọi đường shadow ẩn */
        }

        /* Ảnh tự co giãn vừa khít, giữ nguyên tỷ lệ gốc và KHÔNG đổ bóng */
        .image-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain; 
            position: absolute;
            transition: opacity 0.25s ease;
            box-shadow: none !important; /* Xóa bóng đổ của riêng tệp ảnh */
        }

        .image-container .img-hover {
            opacity: 0;
        }

        /* Hiệu ứng Hover lật ảnh bìa sau mượt mà */
        .image-container:hover .img-main {
            opacity: 0;
        }
        .image-container:hover .img-hover {
            opacity: 1;
        }

        /* Thu nhỏ cỡ chữ và kéo sát khoảng cách lại gần ảnh bìa */
        .book-title {
            font-size: 15px; 
            font-weight: bold;
            color: #111;
            margin: 10px 0 2px 0; /* Giảm khoảng cách phía trên và phía dưới chữ */
            line-height: 1.3;
            width: 100%;
            word-wrap: break-word;
        }

        .book-author {
            font-size: 12px;
            color: #666;
            margin: 0 0 4px 0; /* Thu nhỏ khoảng cách lề dưới */
            width: 100%;
        }

        .btn-read-try {
            font-size: 13px;
            color: #0066cc;
            text-decoration: none;
            font-weight: bold;
            width: 100%;
            display: block;
            margin: 0;
        }
        .btn-read-try:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="books-grid" id="books-container"></div>

<script>
    const container = document.getElementById('books-container');

    DANH_SACH_SACH.forEach((book) => {
        const bookHtml = `
            <div class="book-card" style="width: ${BOOK_WIDTH};">
                <a href="${book.linkForm}" target="_blank" style="display: block; width: 100%;">
                    <div class="image-container" style="width: ${BOOK_WIDTH}; height: ${BOOK_HEIGHT};">
                        <img src="${book.imgMain}" alt="${book.title}" class="img-main">
                        <img src="${book.imgHover}" alt="${book.title} Hover" class="img-hover">
                    </div>
                </a>
                <div class="book-title">${book.title}</div>
                <div class="book-author">Tác giả: ${book.author}</div>
                <a href="${book.linkRead}" target="_blank" class="btn-read-try">Đọc thử tại đây</a>
            </div>
        `;
        container.innerHTML += bookHtml;
    });
</script>

</body>
</html>
