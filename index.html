<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Danh mục Sách Truyện Tối Giản</title>
    <script>
        // =========================================================================
        // DANH SÁCH SÁCH TRUYỆN CỦA BẠN (CHỈ CẦN THÊM HOẶC SỬA TẠI KHU VỰC NÀY)
        // =========================================================================
        const DANH_SACH_SACH = [
            {
                title: "The Blues of Now - Bìa cứng",
                author: "Nguyễn Minh Quang",
                imgMain: "TBON_HC_out.png",
                imgHover: "TBON_in.png",
                linkForm: "https://forms.gle/Nxq3iygZEsd7jD5t9",
                linkRead: "https://sites.google.com/view/kychuongbooks/review"
            },
            {
                title: "The Blues of Now - Bìa mềm",
                author: "Nguyễn Minh Quang",
                imgMain: "TBON_SC_out.png",
                imgHover: "TBON_in.png",
                linkForm: "https://forms.gle/Nxq3iygZEsd7jD5t9",
                linkRead: "https://sites.google.com/view/kychuongbooks/review"
            },
            {
                title: "The other's dream",
                author: "Lê Nguyễn Minh Như",
                imgMain: "TOD_out.png",
                imgHover: "TOD_in.png",
                linkForm: "https://forms.gle/ZsCJ4uoLhM8c6Dak8",
                linkRead: "https://www.facebook.com/share/p/1ECTckV56v/"
            }
        ];

        // Chỉ cố định chiều rộng, chiều cao tự động ôm khít theo ảnh bìa của bạn
        const BOOK_WIDTH  = "300px";
        // =========================================================================
    </script>
   
    <style>
        body {
            font-family: IBM Plex Sans, sans-serif;
            margin: 0; 
            padding: 0; 
            background-color: transparent;
            color: #333;
            overflow-x: hidden;
        }

        /* Lưới hiển thị danh sách sách */
       .copyright{
  text-align:center;
  font-size:9px;
  color:#A9A397;
  margin-top:150px;
  margin-bottom: 25px;
}
/* Lưới hiển thị danh sách sách (CĂN GIỮA TRÌNH DUYỆT) */
        .books-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            justify-content: center; /* Lệnh ép toàn bộ các ô sách căn thẳng ra chính giữa màn hình */
            padding: 15px 10px;      /* Tạo khoảng cách đệm viền nhẹ khi co trên điện thoại */
            box-sizing: border-box;
            width: 100%;
        }

        /* Khối hiển thị tổng thể */
        .book-card {
            display: flex;
            flex-direction: column;
            align-items: center; 
            text-align: center;
            margin-top: 0;
        }

        /* Đường dẫn ảnh ôm sát */
        .image-link {
            display: block; 
            width: 100%; 
            margin: 0; 
            padding: 0;
        }

        /* Khung chứa ảnh tự co giãn chiều cao theo ảnh thực tế để xóa khoảng trống */
        .image-container {
            position: relative;
            cursor: pointer;
            width: 100%;
            margin: 0;
            padding: 0;
            box-shadow: none !important;
            display: block;
        }

        /* Ảnh chính hiển thị tự nhiên dạng khối */
        .image-container .img-main {
            width: 100%;
            height: auto;
            display: block;
            object-fit: contain;
            box-shadow: none !important;
            transition: opacity 0.25s ease; /* Thêm hiệu ứng mờ dần mượt mà */
            opacity: 1;
        }

        /* Ảnh hover ẩn đi và đè chuẩn vị trí tuyệt đối */
        .image-container .img-hover {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            opacity: 0;
            transition: opacity 0.25s ease;
            box-shadow: none !important;
        }

        /* SỬA LỖI CHỒNG ẢNH TRONG SUỐT: 
           Khi hover vào container, ảnh cũ biến mất hoàn toàn và ảnh mới xuất hiện sạch sẽ */
        .image-container:hover .img-main {
            opacity: 0;
        }
        
        .image-container:hover .img-hover {
            opacity: 1;
        }

        /* Phần chữ căn sát chân ảnh bìa */
        .book-title {
            font-size: 15px; 
            font-weight: bold;
            color: #111;
            margin: 0px 0 2px 0; 
            line-height: 1.2;
            width: 100%;
            word-wrap: break-word;
        }

        .book-author {
            font-size: 12px;
            color: #666;
            margin: 0 0 2px 0; 
            width: 100%;
        }

       /* Nút Đọc thử nền đen, chữ trắng, cách text trên đúng 5px */
        .btn-read-try {
            font-size: 13px;
            color: #221E17; /* màu chữ */
            background-color: #E4DDCC; /* Khung nền */
            text-decoration: none;
            font-weight: bold;
            display: inline-block;
            margin-top: 10px; /* Cách dòng text tác giả chính xác 5px */
            padding: 8px 16px; /* Tạo độ rộng vừa vặn cho khung nút bấm */
            border-radius: 4px; /* Bo góc nhẹ cho hiện đại giống các web thương mại */
            transition: background-color 0.2s ease, opacity 0.2s ease;
            width: auto; /* Để nút tự co giãn theo chữ hoặc đổi thành 100% nếu muốn rộng bằng ảnh */
            box-sizing: border-box;
        }
        
        /* Hiệu ứng đổi màu nhẹ khi rê chuột vào nút bấm cho sinh động */
        .btn-read-try:hover {
            background-color: #C5BAA2;
            opacity: 0.9;
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="books-grid" id="books-container"></div>

<script>
    const container = document.getElementById('books-container');

    DANH_SACH_SACH.forEach((book) => {
        const bookHtml = `
            <div class="book-card" style="width: ${BOOK_WIDTH};">
                <a href="${book.linkForm}" target="_blank" class="image-link">
                    <div class="image-container">
                        <img src="${book.imgMain}" alt="${book.title}" class="img-main">
                        <img src="${book.imgHover}" alt="${book.title} Hover" class="img-hover">
                    </div>
                </a>
                <div class="book-title">${book.title}</div>
                <div class="book-author">Tác giả: ${book.author}</div>
                <a href="${book.linkRead}" target="_blank" class="btn-read-try">Đọc thử tại đây</a>
            </div>
        `;
        container.innerHTML += bookHtml;
    });
</script>

<footer>
   <div class="copyright">
    Bản quyền nội dung thuộc Công ty TNHH Kỳ Chương Di Nghệ.
  </div>
</footer>
    
</body>
</html>
